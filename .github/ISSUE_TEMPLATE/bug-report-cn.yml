name: 🐞 Bug反馈
description: 中文Bug反馈模板（NeoForge 1.21.1 移植版）
title: "[Bug]: "
labels: [ "bug" ]

body:
  - type: markdown
    attributes:
      value: |
        **欢迎反馈 NeoForge 1.21.1 移植版的问题！**

        - 提交本 Issue 后会**自动触发编译**，构建产物将在 Actions 运行页的 Artifacts 中提供，随后 Issue 会**自动关闭**
        - 请确保您使用的是最新移植版，所反馈的问题可能已在更新中修复
        - 反馈前请先搜索是否已有相似问题，不要重复提交
        - ⚠️ 请勿将本移植版的问题报告到上游原版仓库

        > [!NOTE]
        > 本 Issue 仅作为编译触发器使用：提交后会自动收到构建结果评论并自动关闭。
        > 若问题未解决，请携带构建产物再次提交新 Issue 并补充信息。

  - type: checkboxes
    id: preliminary
    attributes:
      label: 我已确认 ...
      options:
        - label: 我正在使用最新的 NeoForge 1.21.1 移植版
        - label: 无法在不安装 tacz 时复现
          required: true

  - type: input
    id: minecraft-modloader-version
    attributes:
      label: Minecraft 和 NeoForge 版本
      description: |
        你所使用的 Minecraft 与 NeoForge 版本。

        可在游戏主界面左下角或启动日志开头找到，例如 `1.21.1 / NeoForge 21.1.147`。
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: tacz 移植版版本
      description: 可在模组菜单中查看 tacz-neoforge 的版本号
    validations:
      required: true

  - type: textarea
    id: related
    attributes:
      label: 相关模组
      description: >-
        与 bug 相关的模组列表。
        <br>反馈前请尽量在移除无关模组的情况下复现问题
      placeholder: '在此填写模组列表'
      render: 'raw'
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: >-
        请尽可能详细地描述遇到的问题。
        <br>描述越清晰详尽，处理优先级越高
      placeholder: "期望发生什么 / 实际发生了什么"
    validations:
      required: true

  - type: textarea
    id: step
    attributes:
      label: 复现步骤
      placeholder: |
        1. 安装……

        2. 进入世界……

        3. ……

  - type: textarea
    id: logs
    attributes:
      label: 日志和崩溃报告
      description: >-
        你可以在 `/logs/latest.log` 和 `/crash-reports/` 中找到错误报告，或使用启动器的导出功能。
        <br>建议上传到 https://mclo.gs/ 等网站后贴出链接
        <br>**请不要直接粘贴大段日志文本！！**
      placeholder: '把日志文件放这里或使用外部链接'
