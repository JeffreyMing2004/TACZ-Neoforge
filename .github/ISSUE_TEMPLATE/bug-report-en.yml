name: 🐞 Bug Report
description: English template for reporting a bug (NeoForge 1.21.1 port)
title: "[Bug]: "
labels: [ "bug" ]

body:
  - type: markdown
    attributes:
      value: |
        **Welcome! You are reporting an issue for the NeoForge 1.21.1 port.**

        - Submitting this issue **triggers an automatic build**; the jar artifact will be available under the Actions run page, and the issue will be **closed automatically** afterwards
        - Make sure you are using the latest port version, the problem may already be fixed
        - Please search existing issues before submitting a duplicate
        - ⚠️ Do NOT report issues of this port to the upstream repository

        > [!NOTE]
        > Issues in this repo act as build triggers: you will receive a comment with the build result, then the issue is auto-closed.
        > If the problem persists, open a new issue with the artifact and more details.

  - type: checkboxes
    id: preliminary
    attributes:
      label: I have confirmed that ...
      options:
        - label: I am using the latest NeoForge 1.21.1 port
        - label: unable to reproduce without tacz
          required: true

  - type: input
    id: minecraft-modloader-version
    attributes:
      label: Minecraft and NeoForge version
      description: |
        The Minecraft version and NeoForge version you use.

        You can find them at the corner of the main menu or in the startup log, e.g. `1.21.1 / NeoForge 21.1.147`.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: tacz port version
      description: Versions can be found in the mod menu (tacz-neoforge)
    validations:
      required: true

  - type: textarea
    id: related
    attributes:
      label: Related Mods
      description: >-
        The mods related to the bug.
        <br>Try to reproduce with as few unrelated mods as possible before reporting
      placeholder: 'Mods list here'
      render: 'raw'
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: >-
        Please include as much information as possible.
        <br>The clearer the description, the higher the report processing priority
      placeholder: "What should happen / what actually happened"
    validations:
      required: true

  - type: textarea
    id: step
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Install ...

        2. Join the world ...

        3. ...

  - type: textarea
    id: logs
    attributes:
      label: Logs & Crash reports
      description: >-
        Logs can be found in `/logs/latest.log` and crash reports in `/crash-reports/`.
        <br>Upload to https://mclo.gs/ or similar and paste the link here
        <br>**DO NOT COPY PASTE LOG CONTENT DIRECTLY!**
      placeholder: 'Drag log file here to upload or external pastebin link'
